# Phase 1: PostgreSQL only. API and dashboard services are added in a later phase.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpd}
      POSTGRES_DB: ${POSTGRES_DB:-mpd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mpd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpd} -d ${POSTGRES_DB:-mpd}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mpd_postgres_data:
