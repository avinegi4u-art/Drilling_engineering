services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpd}
      POSTGRES_DB: ${POSTGRES_DB:-mpd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mpd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpd} -d ${POSTGRES_DB:-mpd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpd}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mpd}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mpd}:${POSTGRES_PASSWORD:-mpd}@postgres:5432/${POSTGRES_DB:-mpd}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - backend

volumes:
  mpd_postgres_data:
