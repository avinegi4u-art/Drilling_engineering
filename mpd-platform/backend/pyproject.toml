[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpd-backend"
version = "0.1.0"
description = "FastAPI service for the MPD hydraulics dashboard. Implemented in Phase 4."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.4",
    "mpd-engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
mpd-engine = { path = "../engine" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
