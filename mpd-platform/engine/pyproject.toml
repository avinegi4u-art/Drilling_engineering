[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpd-engine"
version = "0.1.0"
description = "Steady-state MPD hydraulics calculation engine (engineering decision support only)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "MPD Platform contributors" },
]
keywords = ["mpd", "hydraulics", "drilling", "petroleum"]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["mpd_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
