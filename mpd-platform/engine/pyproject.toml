[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpd-engine"
version = "0.1.0"
description = "Steady-state MPD hydraulics calculation engine (SI units internally)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "MPD Platform Contributors" }]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mpd_engine*"]

[tool.setuptools.package-data]
mpd_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["mpd_engine", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mpd_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["mpd_engine"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*", "pandas", "pandas.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

